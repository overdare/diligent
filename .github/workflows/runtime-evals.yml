name: Runtime Evals

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider filter; all runs the defaults (OpenAI and Anthropic, plus Gemini for catalog). chatgpt runs on the shared self-hosted runner."
        required: true
        type: choice
        options: [all, openai, anthropic, gemini, chatgpt]
        default: all
      models:
        description: "default runs the representative profiles; catalog runs the capability tasks on every catalog model"
        required: true
        type: choice
        options: [default, catalog]
        default: default
      capability:
        description: "Optional capability for catalog runs: basic_response, web_search, image_read, image_generation, or compaction"
        required: false
        type: string
      task:
        description: "Optional task ID for default runs; empty runs every runtime task"
        required: false
        type: string
      model:
        description: "Optional model override"
        required: false
        type: string
      seed:
        description: "Optional recorded root seed"
        required: false
        type: string
  workflow_call:
    inputs:
      artifact_retention_days:
        required: false
        type: number
        default: 90
    secrets:
      OPENAI_API_KEY:
        required: true
      ANTHROPIC_API_KEY:
        required: true
      GEMINI_API_KEY:
        required: false

concurrency:
  group: ${{ github.repository }}-model-evals
  cancel-in-progress: false

permissions:
  contents: read

env:
  EVAL_PROVIDER: ${{ inputs.provider || 'all' }}
  EVAL_MODELS: ${{ inputs.models || 'default' }}
  EVAL_CAPABILITY: ${{ inputs.capability || '' }}
  EVAL_TASK: ${{ inputs.task || '' }}
  EVAL_MODEL: ${{ inputs.model || '' }}
  EVAL_SEED: ${{ inputs.seed || '' }}

jobs:
  runtime-evals:
    name: Runtime eval suite (shadow, ${{ matrix.os }})
    if: ${{ inputs.provider != 'chatgpt' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        # A catalog matrix samples models, not platforms, so it runs once on Ubuntu.
        os: ${{ fromJSON(inputs.models == 'catalog' && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Install runtime system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install runtime system dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install ripgrep --yes --no-progress
      - run: bun install --frozen-lockfile
      - name: Run runtime eval suite
        shell: bash
        run: |
          args=(runtime)
          if [ "$EVAL_PROVIDER" != "all" ]; then args+=(--provider "$EVAL_PROVIDER"); fi
          if [ "$EVAL_MODELS" = "catalog" ]; then args+=(--models catalog); fi
          if [ -n "$EVAL_CAPABILITY" ]; then args+=(--capability "$EVAL_CAPABILITY"); fi
          if [ -n "$EVAL_TASK" ]; then args+=(--task "$EVAL_TASK"); fi
          if [ -n "$EVAL_MODEL" ]; then args+=(--model "$EVAL_MODEL"); fi
          if [ -n "$EVAL_SEED" ]; then args+=(--seed "$EVAL_SEED"); fi
          bun run eval "${args[@]}"
      - name: Upload runtime eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-evals-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evals/runtime-*
          if-no-files-found: warn
          retention-days: ${{ inputs.artifact_retention_days || 30 }}

  # ChatGPT OAuth runs only on the shared self-hosted runner that holds the approved test account's credential file.
  # Credentials never enter GitHub: the runner's .env sets DILIGENT_EVAL_CHATGPT_AUTH_FILE. Never add pull_request
  # triggers to this workflow; see docs/guide/evals.md before changing runner access.
  runtime-evals-chatgpt:
    name: Runtime eval suite (ChatGPT OAuth, shared runner)
    if: ${{ inputs.provider == 'chatgpt' }}
    runs-on: [self-hosted, diligent-chatgpt-oauth]
    timeout-minutes: 360
    env:
      # The ChatGPT path must never borrow an API key; clear any machine-level value.
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - name: Check the dedicated OAuth store
        shell: bash
        run: |
          if [ -z "${DILIGENT_EVAL_CHATGPT_AUTH_FILE:-}" ]; then
            echo "::error::DILIGENT_EVAL_CHATGPT_AUTH_FILE is not set in the runner environment."
            exit 1
          fi
      - name: Run runtime eval suite
        shell: bash
        run: |
          args=(runtime --provider chatgpt --non-interactive --chatgpt-auth-file "$DILIGENT_EVAL_CHATGPT_AUTH_FILE")
          if [ "$EVAL_MODELS" = "catalog" ]; then args+=(--models catalog); fi
          if [ -n "$EVAL_CAPABILITY" ]; then args+=(--capability "$EVAL_CAPABILITY"); fi
          if [ -n "$EVAL_TASK" ]; then args+=(--task "$EVAL_TASK"); fi
          if [ -n "$EVAL_MODEL" ]; then args+=(--model "$EVAL_MODEL"); fi
          if [ -n "$EVAL_SEED" ]; then args+=(--seed "$EVAL_SEED"); fi
          bun run eval "${args[@]}"
      - name: Upload runtime eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-evals-chatgpt-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evals/runtime-*
          if-no-files-found: warn
          retention-days: ${{ inputs.artifact_retention_days || 30 }}
