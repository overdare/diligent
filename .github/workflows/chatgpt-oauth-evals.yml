name: ChatGPT OAuth Evals

# Runs only on the shared self-hosted runner that holds the approved ChatGPT test account's OAuth store.
# Credentials never enter GitHub: the runner's .env sets DILIGENT_EVAL_CHATGPT_AUTH_FILE to a local file.
# Keep this workflow free of pull_request triggers; see docs/guide/evals.md before changing runner access.

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: "Optional single ChatGPT model ID; empty runs every ChatGPT catalog model"
        required: false
        type: string
      seed:
        description: "Optional recorded root seed"
        required: false
        type: string
  workflow_call:
    inputs:
      artifact_retention_days:
        required: false
        type: number
        default: 90

concurrency:
  group: ${{ github.repository }}-chatgpt-oauth-evals
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  chatgpt-oauth:
    name: ChatGPT OAuth capability matrix and core suite
    # Scheduled runs wait for this repository variable so an unregistered runner does not queue daily jobs.
    if: ${{ github.event_name != 'schedule' || vars.CHATGPT_OAUTH_EVALS_ENABLED == 'true' }}
    runs-on: [self-hosted, diligent-chatgpt-oauth]
    timeout-minutes: 240
    env:
      # The ChatGPT path must never borrow an API key; clear any machine-level value.
      OPENAI_API_KEY: ""
      EVAL_MODEL: ${{ inputs.model || '' }}
      EVAL_SEED: ${{ inputs.seed || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - run: bun install --frozen-lockfile

      - name: Check the dedicated OAuth store
        shell: bash
        run: |
          if [ -z "${DILIGENT_EVAL_CHATGPT_AUTH_FILE:-}" ]; then
            echo "::error::DILIGENT_EVAL_CHATGPT_AUTH_FILE is not set in the runner environment."
            exit 1
          fi

      - name: Run ChatGPT capability matrix
        shell: bash
        run: |
          args=(capabilities --provider chatgpt --non-interactive
            --chatgpt-auth-file "$DILIGENT_EVAL_CHATGPT_AUTH_FILE"
            --report artifacts/evals/chatgpt-capabilities.json)
          if [ -n "$EVAL_MODEL" ]; then args+=(--model "$EVAL_MODEL"); fi
          if [ -n "$EVAL_SEED" ]; then args+=(--seed "$EVAL_SEED"); fi
          bun run eval "${args[@]}"

      - name: Run ChatGPT core agent suite
        if: always()
        shell: bash
        run: |
          args=(core --provider chatgpt --non-interactive
            --chatgpt-auth-file "$DILIGENT_EVAL_CHATGPT_AUTH_FILE"
            --report artifacts/evals/chatgpt-core.json)
          if [ -n "$EVAL_SEED" ]; then args+=(--seed "$EVAL_SEED"); fi
          bun run eval "${args[@]}"

      - name: Upload ChatGPT eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-oauth-evals-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evals/chatgpt-*
          if-no-files-found: warn
          retention-days: ${{ inputs.artifact_retention_days || 30 }}
